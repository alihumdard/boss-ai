<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="BOSS orb">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#22d3ee" stop-opacity="0.32" />
      <stop offset="75%" stop-color="#6366f1" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rim" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#22d3ee" stop-opacity="0" />
      <stop offset="92%" stop-color="#22d3ee" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#22d3ee" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
  </defs>

  <circle cx="200" cy="200" r="190" fill="url(#halo)" />
  <circle cx="200" cy="200" r="120" fill="url(#core)" />
  <circle cx="200" cy="200" r="120" fill="url(#rim)" />
  <circle cx="200" cy="200" r="120" fill="none" stroke="#22d3ee" stroke-opacity="0.35" stroke-width="1" />

  <!-- Equator ring -->
  <ellipse cx="200" cy="200" rx="158" ry="46" fill="none" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="1.2" />
  <ellipse cx="200" cy="200" rx="158" ry="46" fill="none" stroke="#a855f7" stroke-opacity="0.16" stroke-width="1.2" transform="rotate(18 200 200)" />

  <!-- Sparse particle shell -->
  <g fill="#67e8f9" fill-opacity="0.55">
    <circle cx="96" cy="150" r="1.6" /><circle cx="300" cy="138" r="1.4" />
    <circle cx="330" cy="228" r="1.7" /><circle cx="72" cy="236" r="1.3" />
    <circle cx="150" cy="86" r="1.5" /><circle cx="256" cy="330" r="1.4" />
    <circle cx="126" cy="318" r="1.6" /><circle cx="286" cy="74" r="1.2" />
    <circle cx="204" cy="58" r="1.4" /><circle cx="196" cy="346" r="1.5" />
    <circle cx="58" cy="190" r="1.3" /><circle cx="344" cy="182" r="1.5" />
  </g>
</svg>
